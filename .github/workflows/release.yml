name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY: seuil
  ASSET: seuil-x86_64-unknown-linux-gnu.tar.gz

jobs:
  portable:
    name: Portable x86_64 (Debian 11, glibc 2.31)
    runs-on: ubuntu-24.04
    # Build against the oldest supported glibc. SteamOS is newer than Debian
    # 11, so an artifact built here loads on the Deck and on current desktops.
    # [FR-006]
    container: debian:11
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libdbus-1-dev xz-utils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: >-
          cargo build --release --locked
          --target x86_64-unknown-linux-gnu
          --manifest-path daemon/Cargo.toml
      - name: Verify the glibc baseline and linkage
        run: |
          set -euo pipefail
          bin=daemon/target/x86_64-unknown-linux-gnu/release/seuil
          echo "Container libc:"
          ldd --version | head -n 1
          "$bin" --version
          ldd "$bin" | tee linkage.txt
          # Basic, glibc 2.31-era libraries only. libssl/libcrypto are absent by
          # construction because the build keeps rustls; any other library fails
          # the job rather than shipping an artifact that will not load on
          # SteamOS. ldd prints the loader line as an absolute path, so each
          # token is reduced to its basename before the allowlist match.
          allowed='^(linux-vdso\.so\.1|ld-linux-x86-64\.so\.2|libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|libatomic\.so\.1|libdbus-1\.so\.3)$'
          unexpected="$(awk '{print $1}' linkage.txt | sed 's@^.*/@@' | grep -vE "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::non-basic or OpenSSL linkage: $unexpected"
            exit 1
          fi
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C daemon/target/x86_64-unknown-linux-gnu/release -czf "dist/${ASSET}" "${BINARY}"
          (cd dist && sha256sum "${ASSET}" > "${ASSET}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/*
          if-no-files-found: error

  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed rust cargo git sudo pacman-contrib curl
          source packaging/aur/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"
      - name: Create builder user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
      - name: Sync the tagged version
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
          mkdir -p /tmp/build
          cp -a . /tmp/build
          chown -R builder:builder /tmp/build
      - name: Update checksums and build the package
        run: |
          runuser -u builder -- bash -lc \
            'cd /tmp/build/packaging/aur && updpkgsums && makepkg --noconfirm'
      - name: Collect package
        run: |
          mkdir -p dist
          cp /tmp/build/packaging/aur/${BINARY}-[0-9]*-x86_64.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [portable, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.pkg.tar.zst
